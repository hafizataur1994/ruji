<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Hind Siliguri",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

.ic{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}

#lst{flex:1;overflow:auto;padding-bottom:20px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;text-align:left}
.row:active{background:var(--card)}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:500}
.mid small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.un .mid b,.row.un .mid small{font-weight:700;color:var(--ink)}
.rt{flex:none;display:grid;justify-items:end;gap:4px;color:var(--mute);font-size:12px}
.dot{min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px;font-weight:700}
.empty{text-align:center;color:var(--mute);padding:40px 24px}
.empty a,.pri{display:inline-block;background:var(--brand);color:#fff;border-radius:22px;padding:10px 22px;text-decoration:none;font-weight:500;margin-top:12px}
.sec{padding:10px 14px 2px;color:var(--mute);font-size:14px}
/* chat */
.chead{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.chead b{flex:1;font-weight:500}
#ml{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tm{align-self:center;color:var(--mute);font-size:12px;margin:10px 0 4px}
.b{max-width:78%;padding:7px 13px;border-radius:20px;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--card);align-self:flex-start;animation:pop .18s ease-out}
.b.me{align-self:flex-end;background:var(--me);color:#fff}
.b.t1{border-bottom-left-radius:6px}.b.t2{border-top-left-radius:6px}.b.t1.t2{border-radius:6px 20px 20px 6px}
.b.me.t1{border-bottom-left-radius:20px;border-bottom-right-radius:6px}.b.me.t2{border-top-left-radius:20px;border-top-right-radius:6px}.b.me.t1.t2{border-radius:20px 6px 6px 20px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.cf{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none}
.cf input{flex:1;border:0;background:var(--card);border-radius:22px;padding:10px 16px;outline:0;min-width:0}
.snd{width:42px;height:42px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none}
.snd:disabled{opacity:.35}
.snd svg{width:20px;height:20px;fill:#fff}
/* login */
.lgn{margin:auto;width:100%;max-width:360px;padding:24px;text-align:center}
.lgn h1{margin:10px 0 2px;font-size:34px;color:var(--brand);letter-spacing:-1px}
.lgn p{margin:0 0 20px;color:var(--mute)}
.lgn input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;outline:0}
.lgn input:focus{border-color:var(--brand)}
.lgn .pri{width:100%;border-radius:14px;padding:12px;font-size:17px;margin-top:4px}
.er{color:var(--brand);min-height:22px;margin:4px 0}
.lgn a{color:var(--brand);text-decoration:none;font-weight:500}
.logo{animation:lp .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes lp{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
/* sheet */
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sh>div{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.sh .row{border-radius:12px}
@media (prefers-reduced-motion:reduce){.b,.logo{animation:none}}
</style>
</head>
