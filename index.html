[data-zoom]{cursor:zoom-in}

:root[data-wide="1"] .bar,:root[data-wide="1"] main,:root[data-wide="1"] .nv{max-width:900px}
@media (hover:hover){.ic:hover,.hdr button:hover,.pm button:hover,.chip:hover,.sg:hover{background:var(--line)}.act2 .ab:hover{filter:brightness(.96)}.nv button:hover{color:var(--ink)}}

/* ===== ফেসবুক-ধাঁচের বাম মেনু ===== */
nav{z-index:14}
#dw{position:fixed;left:0;right:0;top:0;bottom:var(--nh,56px);z-index:12;visibility:hidden;pointer-events:none;transition:visibility 0s linear .22s}
#dw.on{visibility:visible;pointer-events:auto;transition-delay:0s}
.dwscrim{position:absolute;inset:0;background:rgba(10,14,28,.5);opacity:0;transition:opacity .22s}
#dw.on .dwscrim{opacity:1}
.dwd{position:absolute;left:0;top:0;bottom:0;width:min(89vw,420px);background:var(--card);overflow-y:auto;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 18px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.2)}
#dw.on .dwd{transform:none}
.avb{flex:none;padding:0;border-radius:50%;background:none;display:grid;line-height:0}
.dwx{display:block;margin:0 0 6px auto;width:36px;height:36px;padding:0;border-radius:50%;background:var(--bg);color:var(--ink);font-size:16px}
.dwc{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(22,32,58,.06),0 6px 18px rgba(22,32,58,.08);margin-bottom:16px}
.dwp{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0;text-align:left;color:var(--ink);font-weight:700;font-size:18px}
.dwp .av{width:52px;height:52px;font-size:20px}
.dwn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dwbell{flex:none;position:relative;width:44px;height:44px;padding:0;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.dwbell .dot,.dwr .dot{margin:0}
.dwbell .dot{position:absolute;top:-4px;right:-4px}
.dwh{margin:4px 0 10px;font-size:18px;font-weight:700}
.dwsc{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.sc{flex:none;width:88px;padding:0;color:var(--ink);text-align:left}
.scp{display:grid;place-items:center;width:88px;height:88px;border-radius:14px;color:#fff;font-size:30px;font-weight:700;margin-bottom:4px}
.sc small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dwr{display:flex;width:100%;align-items:center;gap:14px;padding:12px 4px;color:var(--ink);font-size:17px;font-weight:500;text-align:left;border-radius:10px}
.dwr svg{flex:none;width:26px;height:26px}
.dwl{flex:1;min-width:0}
.dwmore{width:100%;padding:12px;margin:8px 0 14px;background:var(--bg);color:var(--ink);font-weight:600;border-radius:12px}
.dwf{border-top:1px solid var(--line)}
.dwf .dwr{padding:15px 4px}
.dwb{padding:0 4px 12px;color:var(--mute);font-size:15px}
.dwb p{margin:0 0 8px}
.dws{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;margin-bottom:6px;background:var(--bg);color:var(--ink);border-radius:10px;text-align:left}
.dws b{color:var(--brand)}
.dwout{width:100%;margin-top:14px;padding:14px;background:var(--bg);color:var(--ink);font-weight:700;border-radius:12px}
@media (hover:hover){.dwr:hover,.dws:hover,.dwmore:hover,.dwout:hover{background:var(--line)}}
@media (prefers-reduced-motion:reduce){#dw,.dwscrim,.dwd{transition:none}}
.hl{display:flex;align-items:center;gap:8px}
.pfw{margin:-16px -16px 14px;background:var(--card);border-bottom:1px solid var(--line);text-align:center;padding-bottom:16px}
.pcvb{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:18px;font-size:14px}
.pcv{position:relative;height:170px;background:linear-gradient(135deg,var(--brand),#16203A)}
.pfh{position:relative;width:112px;margin:-56px auto 0}
.pav{width:112px;height:112px;border-radius:50%;border:4px solid var(--card);display:grid;place-items:center;color:#fff;font-size:44px;font-weight:700}
.pcam{position:absolute;right:0;bottom:4px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--bg);color:var(--ink);border:2px solid var(--card);display:grid;place-items:center}
.pnm{margin:8px 16px 2px;font-size:24px;overflow-wrap:anywhere}
.pst{color:var(--mute)}.pst b{color:var(--ink)}
.pbio{margin:8px 16px 0;overflow-wrap:anywhere}
.pbt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 16px 0}
.pbt button{border:1px solid var(--line);padding:8px 14px}.pbt .pri{border-color:var(--brand)}
.pdt{text-align:left;margin:16px 16px 0;padding-top:12px;border-top:1px solid var(--line)}
.pdt h3{margin:0 0 6px;font-size:18px}.pdt p{margin:4px 0}
.pfr{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.ttl{font-size:22px;font-weight:700;color:var(--ink)}
body.pf header{position:absolute;left:0;right:0;background:transparent;border:0}
body.pf .logo,body.pf .ttl,body.pf .me{display:none!important}
body.pf #hm{background:rgba(0,0,0,.4);color:#fff}
body.pf::before{background:transparent}
.pin{margin:10px 16px 0;width:calc(100% - 32px)}
.pbw{flex:1}
.pdh{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.pdh:first-child{margin-top:0}
.pdh button{padding:2px 8px}
.pfg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pft{padding:0;color:var(--ink);text-align:left;min-width:0}
.pfi{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:12px;color:#fff;font-size:30px;font-weight:700;margin-bottom:4px}
.pft small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dgr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dcd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.dcd b{display:block;font-size:26px;color:var(--brand)}.dcd span{color:var(--mute);font-size:14px}
.skl{background:var(--bg);animation:skp 1s ease-in-out infinite alternate}
.skb{display:block;height:10px;width:60px;border-radius:5px;background:var(--bg);margin-top:2px;animation:skp 1s ease-in-out infinite alternate}
@keyframes skp{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.skl,.skb{animation:none}}
.fbq{flex:1;min-width:0;text-align:left;padding:10px 16px;border-radius:22px;background:var(--bg);color:var(--mute);font-size:17px;border:1px solid var(--line)}.cmpo{position:fixed;inset:0;z-index:18;margin:0;border-radius:0;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px}.cmpo .cmp1{align-items:flex-start}.cmpo .cmp1 textarea{height:150px;min-height:150px;border-radius:12px;resize:none}
.pul{cursor:pointer}div.pul{display:flex;flex:none}b.pul:active,span.pul:active{opacity:.6}.nmr{flex-wrap:nowrap;column-gap:0}.nmr b{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.nmr .lk,.nmr .mt{flex:none;white-space:nowrap;margin-left:6px}.nmr .lk::before,.nmr .mt::before{content:"· ";color:var(--mute);font-weight:400}
.cm{gap:10px}.cmr{display:flex;gap:8px;align-items:flex-start}.cmr .av{width:34px;height:34px;font-size:14px}.cmb{min-width:0}.cmb p{display:inline-block;border-radius:18px;padding:7px 13px;max-width:100%;overflow-wrap:anywhere;line-height:1.45}.cmb p b{display:block;margin:0;font-size:14px}.cmb small{display:block;color:var(--mute);font-size:12px;margin:2px 0 0 12px}.cmb small button{color:var(--mute)}
.cmw{display:flex;align-items:center;gap:8px}.cmw .av{width:34px;height:34px;font-size:14px}.cmw input{flex:1;min-width:0;border-radius:22px;padding:10px 16px}.snd2{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0}

/* ফেসবুক-স্টাইল: স্ক্রিন ভরা পোস্ট, চিকন পোস্ট বক্স, গোল আইকন */
main{padding-left:0;padding-right:0;max-width:680px}
main .box.post,main .box.cmp:not(.cmpo){border-radius:0;border-left:0;border-right:0;box-shadow:none;margin-bottom:8px}
main .box.post{padding:10px 12px 4px}
main .box.post .pimg{width:calc(100% + 24px);margin:0 -12px 8px;max-height:none}
main .box.rl{border-radius:0;border-left:0;border-right:0}
.box.cmp:not(.cmpo){padding:8px 12px}
.cmp:not(.cmpo) .fbq{height:40px;padding:0 16px;font-size:16px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.cmp:not(.cmpo) .avb svg,.cmp:not(.cmpo) .avb img{width:40px;height:40px}
.me .ic{width:40px;height:40px;border-radius:50%;background:var(--bg)}
.me .ic svg{width:22px;height:22px}
.me .ic[data-n=msg]{background:var(--brand);color:#fff}

/* স্টোরি: ফেসবুকের মতো লম্বা কার্ড, এক লাইনে ৩-এর বেশি */
.stories{gap:8px;padding:4px 10px 8px;margin:0 0 8px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{width:clamp(84px,25vw,118px);height:auto;aspect-ratio:9/16;border-radius:12px}
.st .ring{width:36px;height:36px;top:8px;left:8px}
.st.add{background:var(--card);border:1px solid var(--line)}
.st.add .sta{position:absolute;left:0;right:0;top:0;bottom:30%;width:auto;height:auto;border-radius:0;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700}
.st.add .ring{top:auto;bottom:calc(30% - 18px);left:50%;transform:translateX(-50%);width:36px;height:36px;background:var(--brand);color:#fff;outline:3px solid var(--card);font-size:24px}
.st.add small{bottom:6px;left:4px;right:4px;text-align:center;color:var(--ink);font-weight:600;font-size:13px}

.nv button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nv .nl{font-size:11px;line-height:1.2;font-weight:600}
.act2 .ab[data-a=rxm]{padding:8px 10px}

/* উপরের বার: বাঁয়ে লোগো ও আইকন, ডানে মেনু */
.bar>.hl,.bar>.me{display:contents}
.bar{gap:4px;padding:8px 10px}
.bar .logo{order:1;margin-right:4px}.bar .ttl{order:1;margin-right:4px}
.bar #me{order:2;gap:4px}
.bar #lgw{order:3;margin-left:auto}.bar #th{order:4}.bar #wd{order:5}
.bar #hm{order:9}
header .ic{width:36px;height:36px}
.dwd{left:auto;right:0;transform:translateX(100%);box-shadow:-2px 0 18px rgba(0,0,0,.2)}
#dw.on .dwd{transform:none}

/* বড় লেখা ও বড় বাটন */
body{font-size:17px}
main .box.post .txt{font-size:18px;line-height:1.6}
.act2 .ab{min-height:44px;padding:8px 14px;font-size:16px}
.act2 .ab svg{width:24px;height:24px}
.nv button{padding:10px 0 8px;min-height:58px}
.nv .nl{font-size:12px}
.nv button svg{width:26px;height:26px}
.pri{min-height:44px;font-size:16px}
input[type=text],input[type=password],textarea{font-size:17px}
.fbq{font-size:17px}
.st small{font-size:14px}

header .bar .ic,header .bar #me .ic{width:36px;height:36px}
header .bar .ic svg{width:21px;height:21px}

/* কমেন্ট: ফেসবুকের মতো */
.cmw{display:flex;align-items:center;gap:8px;position:relative;margin-top:6px}
.cmw .av{width:36px;height:36px;flex:none}
.cmw input[data-in]{flex:1;min-width:0;height:42px;border-radius:21px;padding:0 50px 0 16px;background:var(--bg);border:1px solid var(--line);font-size:16px}
.cmw .snd2{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff}
.cmm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.cmm button{padding:4px 2px;font-weight:700;font-size:13px;color:var(--mute);min-height:32px}
.cmm button.on{color:var(--like)}
.cmm .cmo{font-size:20px;line-height:1;padding:0 8px;letter-spacing:1px}
.cmm .clk{font-size:13px;color:var(--mute)}
.cme{flex:1}
.cme input{width:100%;height:42px;border-radius:21px;padding:0 16px;background:var(--bg);border:1px solid var(--brand);font-size:16px}
.cmea{display:flex;gap:10px;align-items:center;margin-top:6px}
.cmea .pri{min-height:36px;padding:4px 18px;border-radius:18px}

/* হেডার বাটন: বড়, আকর্ষণীয় */
header .bar{gap:8px!important;padding:10px 12px!important}
header .bar .ic,header .bar #me .ic{width:44px!important;height:44px!important;box-shadow:0 1px 3px rgba(22,32,58,.14)}
header .bar .ic svg,header .bar #me .ic svg{width:25px!important;height:25px!important}
header .bar .ic[data-n=add]{background:var(--brand)!important;color:var(--on-brand)!important}
header .bar .ic[data-n=search]{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)}
header .bar .ic[data-n=msg]{background:color-mix(in srgb,var(--brand) 14%,var(--card))!important;color:var(--brand)!important}
header .bar .ic:active{transform:scale(.92)}
@media(max-width:350px){header .bar .ic,header .bar #me .ic{width:40px!important;height:40px!important}}

/* ফেসবুক-স্টাইল: পোস্ট বক্স ও স্টোরি */
main .box.cmp:not(.cmpo){padding:10px 12px;margin-bottom:8px}
.cmp:not(.cmpo) .cmp1{gap:10px}
.cmp:not(.cmpo) .fbq{height:42px;padding:0 16px;font-size:16.5px;border-radius:21px;background:var(--bg);border:0;color:var(--mute);display:flex;align-items:center}
.cmp:not(.cmpo) .cph{width:44px;height:44px;background:transparent;color:#45BD62;box-shadow:none}
.cmp:not(.cmpo) .cph svg{width:30px;height:30px}
.stories{gap:8px;padding:4px 12px 10px;margin:0 0 8px;background:var(--card)}
.stories .st{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.stories .st:not(.add)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7));pointer-events:none}
.stories .st:not(.add) .ring{z-index:1;top:10px;left:10px;width:38px;height:38px;border:2px solid #fff;outline:3px solid var(--brand);outline-offset:0;font-size:16px}
.stories .st:not(.add) small{z-index:1;font-size:13px;font-weight:700;color:#fff;left:10px;right:8px;bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.stories .st.add .ring{width:40px;height:40px;outline:3px solid var(--card);bottom:calc(30% - 20px);background:var(--brand);color:#fff;font-size:26px;line-height:1}
.stories .st.add small{font-size:13px;font-weight:700;color:var(--ink);bottom:8px}

/* ফেসবুক হুবহু: পোস্ট বক্স, স্টোরি, পোস্ট হেডার */
.cmp:not(.cmpo) .fbq{background:var(--card)!important;border:1px solid var(--mute)!important;color:var(--ink)!important;height:44px;font-size:17px}
.cmp:not(.cmpo) .cph{color:var(--mute)!important}
.cmp:not(.cmpo) .cph svg{width:32px;height:32px}
.stories{gap:4px!important;padding:0 3px 12px!important;margin:-8px 0 8px!important;background:var(--card)}
.stories .st{width:clamp(100px,29.5vw,132px)!important;aspect-ratio:116/214;height:auto!important;border-radius:14px!important;box-shadow:none}
.stories .st:not(.add)::after{height:45%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}
.stories .st:not(.add) .ring{top:9px!important;left:9px!important;width:32px!important;height:32px!important;border:2px solid #fff;outline:3px solid var(--brand);outline-offset:0;box-sizing:border-box;font-size:14px}
.stories .st:not(.add) small{left:10px!important;right:8px!important;bottom:10px!important;font-size:14px;font-weight:600;line-height:1.25;white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.stories .st.add{background:var(--bg)!important;border:1px solid var(--line)!important}
.stories .st.add .sta{bottom:33%!important}
.stories .st.add .ring{width:38px!important;height:38px!important;bottom:calc(33% - 19px)!important;outline:3px solid var(--bg)!important;font-size:28px}
.stories .st.add small{font-size:14px;font-weight:600;bottom:9px!important}
.hd2 .nmr b{font-size:16.5px;font-weight:700}
.hd2 .nmr .lk{font-weight:600;font-size:15.5px;color:var(--brand)}
.hd2 .nmr .lk::before{content:"· ";color:var(--mute);font-weight:400}
.hd2 .hdm small{font-size:14px;color:var(--mute)}
.hdr button{font-size:24px;color:var(--ink)}
.hdr button[data-a=hide]{font-size:22px}
.post .txt{font-size:16.5px;line-height:1.5}

/* Ruji reels – Facebook style */
html:has(.box.rl):not(:has(.box.post)){scroll-snap-type:y proximity}
main .box.rl{scroll-snap-align:start;margin:0 0 2px;background:#000;border:0;border-radius:0}
.rlm{aspect-ratio:auto;max-height:none;height:calc(100dvh - 150px);min-height:440px;background:#000}
.rlm video{object-fit:cover;background:#000}
.rlm::before{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none}
.rlm .rtop,.rlm .rail,.rlm .cap{z-index:2}
.rail{bottom:84px;gap:6px}
.rail .ab{background:transparent;text-shadow:0 1px 3px rgba(0,0,0,.8);min-width:52px}
.rail .ab svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.cap{bottom:84px;right:84px}
.cap .nm{font-size:16px}
.cap .nm .fol{border:1px solid #fff;border-radius:8px;padding:2px 12px;font-size:14px;background:transparent}

/* Ruji header – clean Facebook style */
header .bar #me{margin-left:auto}
header .bar{gap:8px!important}
header .bar .ic[data-n=add],header .bar .ic[data-n=search],header .bar #hm{background:var(--bg)!important;color:var(--ink)!important;border:0!important;box-shadow:none!important}
header .bar .ic[data-n=msg]{background:var(--brand)!important;color:#fff!important;border:0!important;box-shadow:0 2px 6px rgba(190,18,60,.35)!important}
header .bar .ic[data-n=msg] svg{stroke:#fff}
header .bar .ic .dot{top:-4px;right:-4px;border:2px solid var(--card)}

/* Ruji bottom bar – icons only, equal size */
.nv .nl{display:none!important}
.nv button{min-height:54px!important;padding:0!important;border-top:3px solid transparent!important;color:var(--mute)!important}
.nv button svg{width:28px!important;height:28px!important}
.nv button.on{color:var(--brand)!important;border-top-color:var(--brand)!important}
.nv button.on svg{stroke-width:2.4!important;fill:color-mix(in srgb,var(--brand) 14%,transparent)!important}
.nv .nav-av{width:28px;height:28px}
.nv .dot{top:7px!important;left:calc(50% + 4px)!important}

/* Ruji composer – thin long pill like Facebook */
main .box.cmp:not(.cmpo){padding:10px 10px 10px 12px}
.cmp:not(.cmpo) .cmp1{gap:8px}
.cmp:not(.cmpo) .fbq{height:34px!important;padding:0 14px!important;font-size:16px!important;border-radius:17px!important;line-height:1;flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden}
.cmp:not(.cmpo) .avb svg,.cmp:not(.cmpo) .avb img,.cmp:not(.cmpo) .avb .av{width:40px!important;height:40px!important}
.cmp:not(.cmpo) .cph{width:36px!important;height:36px!important;margin-left:2px}
.cmp:not(.cmpo) .cph svg{width:24px!important;height:24px!important}

/* Ruji composer avatar – soft ring like Facebook */
.cmp:not(.cmpo) .avb{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12);overflow:hidden;align-self:center}
